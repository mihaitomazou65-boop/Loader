services:
  - type: web
    name: loader-auth-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loader-db
          property: connectionString

databases:
  - name: loader-db
    plan: free
